[project]
name = "mspbots-rmm-mcp"
version = "0.2.0"
description = "MCP server for the MSPbots RMM Control API (vendor-agnostic device/script/execution API, formerly mb-platform-fleet)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
mspbots-rmm-mcp = "mspbots_rmm_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mspbots_rmm_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
