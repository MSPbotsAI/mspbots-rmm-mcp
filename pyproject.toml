[project]
name = "mspbots-fleet-mcp"
version = "0.1.0"
description = "MCP server for the MSPbots Fleet Platform API (fleetdm multi-tenant console: hosts, scripts, saved queries)"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0,<2.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
    "starlette>=0.41.0",
]

[project.scripts]
mspbots-fleet-mcp = "mspbots_fleet_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mspbots_fleet_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
